spring:
  application:
    name: rikser-bundle

bundle:
  security:
    enabled: true
    service:
      enabled: true
      url: http://localhost:8081
  redis:
    enabled: true
    TTL: P1D
    prefix: prefix
  kafka:
    enabled: true
    user: ${KAFKA_USER}
    password: ${KAFKA_PASSWORD}
    kafka-url: ${KAFKA_URL}
    max-fetch-limit: 100
  expiration-time: ${EXPIRATION_TIM:3600000}